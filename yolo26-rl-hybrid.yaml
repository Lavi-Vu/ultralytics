# Ultralytics YOLO26 RL-Hybrid Configuration
# Architecture: YOLO26-Nano Backbone + Dynamic RL-Transformer Neck

# Parameters
nc: 80  # number of classes
end-to-end: True  # train with end-to-end RL-Transformer
reg_max: 1
scales: # model scale coefficients
  n: [0.5, 0.25, 1024] # [depth, width, max_channels]

# -------------------------------------------------------------------------------------------------
# Backbone
# -------------------------------------------------------------------------------------------------
backbone:
  # [from, number, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  # Index 10: RL-Transformer at the bottleneck
  - [-1, 1, DynamicTransformerBlock, [1024, 4]] # 10
# -------------------------------------------------------------------------------------------------
# Head
# -------------------------------------------------------------------------------------------------
head:  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 (Merge with P4)
  - [-1, 2, C3k2, [512, True]] # 13
  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 (Merge with P3)
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)
  
  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)
  
  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  - [16, 1, ShapeAttention, [256]]  # 22
  - [19, 1, ShapeAttention, [512]]  # 23
  - [22, 1, ShapeAttention, [1024]] # 24

  - [[22, 23, 24], 1, Detect, [nc]] # 23 (P3, P4, P5)
