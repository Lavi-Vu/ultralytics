# Ultralytics YOLO26 RL-Hybrid Configuration
# Architecture: YOLO26-Nano Backbone + Dynamic RL-Transformer Neck

# Parameters
nc: 80  # number of classes
scales: # model scale coefficients
  # [from, n, s, m, l, x]
  n: [0.33, 0.25, 1024, 1280] 

# -------------------------------------------------------------------------------------------------
# Backbone
# -------------------------------------------------------------------------------------------------
backbone:
  # [from, number, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2- la 
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, False]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, False]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, False]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, False]] # 8

# -------------------------------------------------------------------------------------------------
# Neck (The Hybrid Part)
# -------------------------------------------------------------------------------------------------
neck:
  - [-1, 1, SPPF, [1024, 5]] # 9 (Global context compression)
  
  # --- RL-Transformer Integration ---
  # We place the DynamicTransformerBlock here at the lowest resolution (P5).
  # Args: [c1, c2, num_heads]
  - [-1, 1, DynamicTransformerBlock, [1024, 1024, 4]] # 10 - GLOBAL CONTEXT + RL PRUNING
  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 (Merge with P4)
  - [-1, 3, C2f, [512]] # 13
  
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 (Merge with P3)
  - [-1, 3, C2f, [256]] # 16
  
  # Bottom-up path
  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18
  - [-1, 3, C2f, [512]] # 19
  
  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21 (Merge with the RL-Transformer output)
  - [-1, 3, C2f, [1024]] # 22

# -------------------------------------------------------------------------------------------------
# Head
# -------------------------------------------------------------------------------------------------
head:
  - [[16, 19, 22], 1, Detect, [nc]] # 23 (Detection heads for P3, P4, P5)
