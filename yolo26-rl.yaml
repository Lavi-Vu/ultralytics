# Ultralytics YOLO26-RL object detection model with P3/8 - P5/32 outputs
# Improved architecture with multi-head gated DynamicTransformerBlock at P4 + P5,
# windowed attention in neck (C2fHybrid), and global attention at P5 neck.
#
# Key accuracy improvements vs baseline yolo26-rl:
#   1. DynamicTransformerBlock at both P4 (layer 7) and P5 (layer 11) backbone
#   2. 8 attn heads at P5 (was 4), 4 at P4
#   3. Multi-headed gate (4 heads) for richer token selection
#   4. Pre-attention + post-FFN gating (was only post-FFN)
#   5. YAML repeat count controls n_blocks (was hardcoded 2)
#   6. Neck: C2fHybrid (windowed attn) at P4, C2fHybridGlobal at P5
#   7. P3 neck stays C3k2 (high res, CNN is faster)
#
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80
end2end: True
reg_max: 1
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26-RL improved backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]                 # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]         # 2
  - [-1, 1, Conv, [256, 3, 2]]                # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]         # 4
  - [-1, 1, Conv, [512, 3, 2]]                # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                # 6
  - [-1, 1, DynamicTransformerBlock, [512, 4, 4]]   # 7 — NEW at P4
  - [-1, 1, Conv, [1024, 3, 2]]               # 8-P5/32
  - [-1, 2, C3k2, [1024, True]]               # 9
  - [-1, 1, SPPF, [1024, 5, 3, True]]         # 10
  - [-1, 1, DynamicTransformerBlock, [1024, 8, 4]]  # 11 — IMPROVED heads 4→8
  
# YOLO26-RL improved head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                 # cat backbone P4 (layer 6)
  - [-1, 2, C2fHybrid, [512, True, 0.5, 4, 7]]  # 14 — was C3k2, now windowed attn

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]                 # cat backbone P3 (layer 4)
  - [-1, 2, C3k2, [256, True]]                # 17 — P3/8-small (keep CNN, high res)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]                # cat head P4
  - [-1, 2, C2fHybrid, [512, True, 0.5, 4, 7]]  # 20 — was C3k2, now windowed attn

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]                # cat backbone P5 (layer 11)
  - [-1, 1, C2fHybridGlobal, [1024, True, 0.5, 8, 2]]  # 23 — was C3k2, now global attn

  - [[17, 20, 23], 1, Detect, [nc]]           # Detect(P3, P4, P5)
