# Ultralytics LiteYOLO-Next (LYN) - Lightweight Object Detector
# Architecture innovations: GDP-Attention, SPPF-C, ASFF-Neck, SCDown
# Compatible with Ultralytics YOLO framework
# Targets: Nano (LYNn) and Small (LYNs) scales for mobile/edge deployment

# Parameters
nc: 80  # number of classes
end2end: True  # NMS-free mode
reg_max: 1  # DFL-free direct bbox regression

# Model scales
scales:
  n: [0.50, 0.25, 1024]   # Nano:  ~2.6M params,  ~6.2GFLOPs
  s: [0.50, 0.50, 1024]   # Small: ~10.5M params, ~23GFLOPs

# Backbone
backbone:
  # P1/2: Stem
  - [-1, 1, Conv, [64, 3, 2]]                          # 0  P1/2  (16)
  - [-1, 1, Conv, [128, 3, 2]]                         # 1  P2/4  (32)

  # P2/4 Stage: C3k2 (standard)
  - [-1, 2, C3k2, [256, False, 0.25]]                   # 2  P3/8  (64)

  # P3/8 Stage: Conv + GDP-enhanced C3k2
  - [-1, 1, Conv, [256, 3, 2]]                          # 3  P3/8  (64)
  - [-1, 2, GDP_C3k2, [512, False, 0.25]]               # 4  P3/8  (128)

  # P4/16 Stage: Conv + GDP-enhanced C3k2
  - [-1, 1, Conv, [512, 3, 2]]                          # 5  P4/16 (128)
  - [-1, 2, GDP_C3k2, [512, True, 0.5]]                # 6  P4/16 (128)

  # P5/32 Stage: Conv + GDP-C3k2 backbone end
  - [-1, 1, Conv, [1024, 3, 2]]                         # 7  P5/32 (256)
  - [-1, 2, GDP_C3k2, [1024, True, 0.5]]               # 8  P5/32 (256)

  # Compact SPPF + C2PSA
  - [-1, 1, SPPF_C, [1024, 5, 3, True]]                # 9  P5/32 (256)
  - [-1, 2, C2PSA, [1024]]                              # 10 P5/32 (256)

# Head
head:
  # Upsample + ASFF-Neck fusion (P5/32 -> P4/16)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 11 Upsample to P4/16
  - [[-1, 7], 1, ASFF_Neck, [512]]                    # 12 ASFF: P5+P4 -> 512ch
  - [-1, 2, C3k2, [512, True, 0.5]]                    # 13 P4/16 output (128ch)

  # Upsample + ASFF-Neck fusion (P4/16 -> P3/8)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]         # 14 Upsample to P3/8
  - [[-1, 4], 1, ASFF_Neck, [256]]                    # 15 ASFF: P4+P3 -> 256ch
  - [-1, 2, C3k2, [256, True, 0.25]]                   # 16 P3/8 output (64ch)

  # Downsample branch
  - [-1, 1, Conv, [256, 3, 2]]                          # 17 Downsample P3->P4
  - [[-1, 13], 1, Concat, [1]]                         # 18 Concat with head P4
  - [-1, 2, C3k2, [512, True, 0.5]]                    # 19 P4/16 output (128ch)

  - [-1, 1, Conv, [512, 3, 2]]                          # 20 Downsample P4->P5
  - [[-1, 10], 1, Concat, [1]]                         # 21 Concat with backbone P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]]             # 22 P5/32 output (256ch)

  # Detect: P3, P4, P5 detection heads
  - [[16, 19, 22], 1, Detect, [nc]]                     # 23 Detect (80 classes)