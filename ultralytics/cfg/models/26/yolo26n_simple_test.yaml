# Simple test model to verify LinearAttentionBlock works
# Model docs: https://docs.ultralytics.com/models/yolo26
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  n: [0.50, 0.25, 1024] # summary: 260 layers, parameters TBD, gradients TBD, GFLOPs TBD

# Very simple backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, LinearAttentionBlock, [128, 8, 0.5]] # 2 - Testing LinearAttentionBlock
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 1, SPPF, [256, 5, 3, True]] # 4
  - [-1, 2, C2PSA, [256]] # 5

# Simple head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [128, True]] # 6

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [64, True]] # 9 (P3/8-small)

  - [[6, 9], 1, Detect, [nc]] # Detect