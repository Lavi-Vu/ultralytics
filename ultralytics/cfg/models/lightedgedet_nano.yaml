# LightEdgeDet Nano (YOLO26-P6 backbone + C3k2 PAFPN) — ultralytics-compatible model config
# Architecture: dense Conv stem + 5 C3k2 stages (c3k bottleneck on P5/P6, PSA attn on P6)
# + SPPF + C2PSA global context + C3k2PAFPN neck (cross-scale fusion) + per-scale Detect head.
# Recipe: YOLO26 E2E (end-to-end, reg_max=1) + RT-DETRv4 cross-scale fusion in the neck.
# Budget: ~2.9M params, ~6.8 GFLOPs (vs YOLO26n: 2.4M/5.4G @ 0.401)

# Classification
nc: 80

# Backbone (Yolo26Backbone — 5 stages, outputs P3/P4/P5/P6)
backbone_arch: yolo26
backbone_channels: [16, 32, 64, 128, 192]
backbone_depths: [1, 1, 1, 1, 1]
backbone_c3k_stages: [0, 0, 0, 1, 1]
backbone_attn_stages: [0, 0, 0, 0, 1]
backbone_use_sppf: True

# Neck (C3k2PAFPN — dense C3k2 top-down/bottom-up + cross-scale fusion)
neck_arch: c3k2pafpn
neck_out_channels: 132
neck_num_blocks: 1
neck_use_cross_fusion: True

# Detect head (standard per-scale Detect, YOLO26 end-to-end recipe)
head_type: standard
head_channels: 132
reg_max: 1
strides: [8, 16, 32, 64]
end2end: True

# Training defaults (ultralytics trainer reads these from here as fallback)
lr0: 0.001
lrf: 0.01
momentum: 0.9
weight_decay: 0.05
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5
nbs: 64
