# LightEdgeDet Nano — ultralytics-compatible model config
# Architecture: CNN stem + 5 LiteBlock stages (MViT attention on P5/P6)
# + SPPF global context + LitePAFPN neck + per-scale decoupled Detect head.
# Budget: ~3.15M params, ~6.0 GFLOPs (vs YOLO26n: 2.4M/5.4G)

# Classification
nc: 80

# Backbone (HybridBackbone — 5 stages, outputs P3/P4/P5/P6)
backbone_stem_channels: 20
backbone_channels: [30, 60, 116, 164, 214]
backbone_depths: [2, 3, 4, 3, 2]
backbone_expand_ratios: [2.5, 2.5, 3.0, 3.5, 4.0]
backbone_se_ratios: [0.25, 0.25, 0.25, 0.25, 0.25]
backbone_attn_stages: [0, 0, 0, 1, 1]
backbone_drop_path_rate: 0.1
backbone_use_sppf: True

# Neck (LitePAFPN — stacked residual blocks + learnable downsampling)
neck_out_channels: 88
neck_num_blocks: 3

# Detect head (standard per-scale Detect = proven 0.35-baseline design)
head_type: standard
head_channels: 88
reg_max: 16
strides: [8, 16, 32, 64]
end2end: False

# Training defaults (ultralytics trainer reads these from here as fallback)
lr0: 0.001
lrf: 0.01
momentum: 0.9
weight_decay: 0.05
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5
nbs: 64
