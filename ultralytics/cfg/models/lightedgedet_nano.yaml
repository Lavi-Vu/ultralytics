# LightEdgeDet Nano — ultralytics-compatible model config
# Architecture: CNN stem + 5 LiteBlock stages (C2PSA-style LitePSA attention on P5/P6,
# large-kernel depthwise on P5/P6) + SPPF global context + LitePAFPN neck
# (RepNCSPELAN4-style reparameterized depthwise blocks + cross-scale fusion)
# + per-scale Detect head.
# LiteBlock uses RepDWConv: reparameterized depthwise convs that fuse to a single
# depthwise conv at inference (dense-like training capacity, depthwise inference cost).
# Recipe: YOLO26 E2E (end-to-end, reg_max=1) + RT-DETRv4 cross-scale fusion + DINOv3 distill.
# Budget: ~3.7M params, ~6.8 GFLOPs (inference, fused)

# Classification
nc: 80

# Backbone (HybridBackbone — 5 stages, outputs P3/P4/P5/P6)
backbone_stem_channels: 20
backbone_channels: [37, 74, 140, 196, 244]
backbone_depths: [2, 3, 4, 3, 2]
backbone_expand_ratios: [2.5, 2.5, 3.0, 3.5, 4.0]
backbone_se_ratios: [0.25, 0.25, 0.25, 0.25, 0.25]
backbone_attn_stages: [0, 0, 0, 1, 1]
backbone_kernel_sizes: [3, 3, 3, 7, 7]
backbone_drop_path_rate: 0.1
backbone_use_sppf: True
backbone_psa_ratio: 0.5
backbone_psa_blocks: 1
backbone_reparam: True

# Neck (LitePAFPN — reparameterized residual blocks + learnable downsampling + cross-scale fusion)
neck_out_channels: 104
neck_num_blocks: 3
neck_use_cross_fusion: True
neck_reparam: True

# Detect head (standard per-scale Detect, YOLO26 end-to-end recipe)
head_type: standard
head_channels: 104
reg_max: 1
strides: [8, 16, 32, 64]
end2end: True

# DINOv3 distillation weight (RT-DETRv4 recipe; teacher passed via `distill_model` arg,
# master switch `distill: True/False` in cfg/default.yaml)
dis: 6.0

# Training defaults (ultralytics trainer reads these from here as fallback)
lr0: 0.001
lrf: 0.01
momentum: 0.9
weight_decay: 0.05
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5
nbs: 64
