# LightEdge-YOLO Small: lightweight NMS-free object detection model
# Model docs: https://github.com/ultralytics/ultralytics/blob/main/ultralytics/nn/modules/LIGHTEDGE_README.md

# Parameters
nc: 80 # number of classes
stem_channels: 24
bifpn_channels: 160
head_hidden: 80

# Backbone stages
# each stage: [channels, depth, stride, expand]
stage_configs:
  - [48,  4, 2, 2]  # P2/4
  - [96,  6, 2, 2]  # P3/8
  - [192, 8, 2, 2]  # P4/16
  - [384, 4, 2, 2]  # P5/32
