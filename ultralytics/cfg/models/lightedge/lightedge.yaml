# LightEdge-YOLO: Lightweight object detection model with RepViTGhost backbone,
# Adaptive BiFPN neck, and enhanced one-to-one decoupled head.
# Designed for edge deployment with superior small-object detection.

# Parameters
nc: 80 # number of classes
end2end: True # NMS-free one-to-one detection
reg_max: 16 # DFL for precise box regression
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.83, 0.80, 1024] # LightEdge-Nano (2.58M params, 6.6 GFLOPs)
  s: [1.00, 1.00, 1024] # LightEdge-Small (10.3M params, 22.8 GFLOPs)

# LightEdge backbone: RepViTGhost Hybrid (P3-P5)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [32, 3, 2]]         # 0-P1/2
  - [-1, 1, Conv, [64, 3, 2]]         # 1-P2/4
  # C3RepViTGhost args: [c2, shortcut, e] (n is inserted by parse_model.repeat_modules)
  - [-1, 1, C3RepViTGhost, [64, False, 0.25]]   # 2-P2 feat (light, high-res)
  - [-1, 1, Conv, [64, 3, 2]]         # 3-P3/8
  - [-1, 2, C3RepViTGhost, [128, False, 0.25]]  # 4-P3 feat
  - [-1, 1, Conv, [128, 3, 2]]        # 5-P4/16
  - [-1, 2, C3RepViTGhost, [256, True]]         # 6-P4 feat
  - [-1, 1, Conv, [256, 3, 2]]        # 7-P5/32
  - [-1, 1, C3RepViTGhost, [512, True]]         # 8-P5 feat
  - [-1, 1, SPPF, [512, 5]]           # 9-P5 pooled

# LightEdge neck: Adaptive BiFPN (3-level)
# LightEdge head: Enhanced one-to-one decoupled head (P3, P4, P5)
head:
  # Top-down path
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 6], 1, FastBiFusion, [192]]            # 11-P4_td
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 12
  - [[-1, 4], 1, FastBiFusion, [96]]             # 13-P3_out (small)

  # Bottom-up path
  - [-1, 1, Conv, [96, 3, 2]]                   # 14
  - [[-1, 11], 1, FastBiFusion, [192]]           # 15-P4_out (medium)
  - [-1, 1, Conv, [192, 3, 2]]                  # 16
  - [[-1, 9], 1, FastBiFusion, [384]]            # 17-P5_out (large)

  # Detection head (P3, P4, P5)
  - [[13, 15, 17], 1, LightEdgeDetect, [nc]]    # 18
