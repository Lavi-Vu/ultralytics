# LightEdgeDet Medium — ultralytics-compatible model config
# Architecture: CNN stem + 5 LiteBlock stages (MViT attention on P4/P5/P6)
# + SPPF global context + LitePAFPN neck + shared decoupled head.
# Budget: ~7.7M params, ~12.8 GFLOPs

# Classification
nc: 80

# Backbone (HybridBackbone — 5 stages, outputs P3/P4/P5/P6)
backbone_stem_channels: 27
backbone_channels: [41, 82, 163, 245, 326]
backbone_depths: [2, 4, 5, 4, 2]
backbone_expand_ratios: [4.0, 4.0, 4.0, 4.0, 4.0]
backbone_se_ratios: [0.25, 0.25, 0.25, 0.25, 0.25]
backbone_attn_stages: [0, 0, 1, 1, 1]
backbone_drop_path_rate: 0.15
backbone_use_sppf: True

# Neck (LitePAFPN)
neck_out_channels: 128
neck_num_blocks: 2

# Detect head
reg_max: 16
head_type: standard
head_channels: 96
strides: [8, 16, 32, 64]
end2end: False

# Training defaults (ultralytics trainer reads these from here as fallback)
lr0: 0.001
lrf: 0.01
momentum: 0.9
weight_decay: 0.05
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5
nbs: 64
