# Ultralytics YOLO26 object detection model — FPN-only GhostConv (E5)
# PAN removed for minimal FLOPs. P4 and P5 taken directly from FPN + backbone.
# GhostC3k2 in both FPN neck positions.
#
# Requires: import ultralytics_patch   # register custom module names

# Parameters
nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]            # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]           # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]    # 2
  - [-1, 1, Conv, [256, 3, 2]]           # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]    # 4
  - [-1, 1, Conv, [512, 3, 2]]           # 5-P4/16
  - [-1, 2, C3k2, [512, True]]           # 6
  - [-1, 1, Conv, [1024, 3, 2]]          # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]          # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]]    # 9
  - [-1, 2, C2PSA, [1024]]               # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, GhostC3k2, [512, True]]     # 13 (P4/16)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, GhostC3k2, [256, True]]     # 16 (P3/8)
  # PAN removed — P4 from layer 13, P5 from layer 10
  - [[16, 13, 10], 1, Detect, [nc]]